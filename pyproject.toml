[project]
name = "npc-voice-studio"
version = "0.1.0"
description = "Local NPC voice creation and cloning with OmniVoice"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==1.14.0",
    "gradio==6.22.0",
    "huggingface-hub==1.26.0",
    "librosa==0.11.0",
    "numpy==2.4.6",
    "omnivoice==0.2.1",
    "pydub==0.25.1",
    "soundfile==0.14.0",
    "tensorboardX==2.6.5",
    "torch==2.8.0+cu128",
    "torchaudio==2.8.0+cu128",
    "transformers==5.14.1",
    "webdataset==1.0.2",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
